  # ---------------- Layer 3: root + human, on main ----------------
  - id: I1
    layer: 3
    ws: root
    title: Compose the CLI and run the whole pipeline on fakes
    deps: [A, B, C, D, E]
    owns: ["src/cli.ts", "src/compose.ts"]
    prompt: |
      npm run swarm -- --brief <file> --repo <owner/name> [--dry-run] [--fake-agent] [--fixture-plan] [--local] [--port 3000]
      compose.ts builds ports from env and flags: --local uses the fakes (LocalSandboxRunner, MemoryStore,
      MemoryDisk, RecordingPublisher); otherwise Archil (createSqliteStore(archilDb(disk, "swarm/state.sqlite")),
      createArchilSandboxRunner, createArchilDisk). Publisher is dry-run unless GITHUB_TOKEN is set and --dry-run
      is absent. Research is Keenable (keyed when KEENABLE_API_KEY is set).
      Flow: runId -> plan (fixture, or planner + validatePlan with fixture fallback) -> runResearch -> savePlan ->
      publishPlan -> upload src/worker/run-task.sh and fixtures/agent/** to /swarm/ on the disk -> prepareTemplate
      (setup = run T1 through run-task.sh inside the template) -> mark T1 done after its gate and merge -> fork 3 ->
      scheduler.runUntilDone with recovery and integrator -> writeReport -> print the dashboard URL.
      The dashboard runs in-process; its stopTask hook is recovery.requestStop.
    verify: ["npm run typecheck", "npm test", "npm run swarm -- --local --fake-agent --fixture-plan --brief demo/brief.md --repo local/demo"]
    est_min: 25

