name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Configure git identity for tests
        run: |
          git config --global user.name "swarm-ci"
          git config --global user.email "swarm-ci@users.noreply.github.com"
          git config --global init.defaultBranch main
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End-to-end swarm (local, fake agent)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Configure git identity for local merges
        run: |
          git config --global user.name "swarm-ci"
          git config --global user.email "swarm-ci@users.noreply.github.com"
          git config --global init.defaultBranch main
      - name: Run the bookmark-manager brief end to end
        run: |
          npm run swarm -- --brief demo/bookmark-brief.md --repo demo/bookmarks \
            --local --fake-agent --port 0 | tee swarm.log
          grep -q "Final acceptance suite: PASS" swarm.log
      - name: Publish delivery report to the job summary
        if: always()
        run: |
          report=$(ls -t .swarm/runs/*/report.md 2>/dev/null | head -1 || true)
          if [ -n "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: delivery-report
          path: |
            swarm.log
            .swarm/runs/*/report.md
          if-no-files-found: ignore
