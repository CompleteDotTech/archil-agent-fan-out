changelog:
  exclude:
    labels: [ignore-for-release]
  categories:
    - title: ✨ Features
      labels: [enhancement]
    - title: 🐛 Fixes
      labels: [bug]
    - title: 📚 Documentation
      labels: [documentation]
    - title: 🧰 Maintenance
      labels: [ci, dependencies, chore]
    - title: Other changes
      labels: ['*']
