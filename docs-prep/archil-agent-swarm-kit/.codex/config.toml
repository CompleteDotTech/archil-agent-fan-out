# Project-scoped Codex settings for the build swarm.
# If your Codex version ignores project config, copy these keys into ~/.codex/config.toml.

[agents]
# Five workstream orchestrators plus one spare. Leaf workers are separate `codex exec`
# processes started by swarm/bin/swarm.mjs, so they don't count against this cap.
max_concurrent_threads_per_session = 6
# Older releases use the legacy name instead:
# max_threads = 6

# Older releases need subagents switched on explicitly:
# [features]
# multi_agent = true
