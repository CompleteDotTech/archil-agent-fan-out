      opts?: { projectUrl?: string; publicDir?: string }) returns a Hono app:
      - GET /api/runs/:runId -> { plan, statuses, attempts, issues, events: last 300, projectUrl }
      - GET /api/runs/:runId/stream -> SSE; poll store.listEvents(runId, after) every 1 s; one `data: <json>` per event
      - POST /api/runs/:runId/tasks/:taskId/stop -> hooks.stopTask
      - GET / -> src/dashboard/public/index.html
